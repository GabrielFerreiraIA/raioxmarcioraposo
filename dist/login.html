<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#17151f">
  <title>Acesso ao Raio-X | Multiplix</title>
  <link rel="icon" href="/assets/multiplix-symbol.jpg">
  <link rel="stylesheet" href="/login.css">
  <script defer src="/login.js"></script>
</head>
<body>
  <main class="login-screen">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="brand"><img src="/assets/multiplix-symbol.jpg" alt="" width="42" height="42"><span>MULTIPLIX</span></div>
      <div class="login-content">
        <p class="eyebrow"><span aria-hidden="true"></span> ACESSO AO RAIO-X · MARCIO RAPOSO</p>
        <h1 id="login-title">Sua análise comercial está pronta.</h1>
        <p class="login-intro">Jaerty e Leo, este é o mapa dos pontos discutidos no diagnóstico e das perguntas que orientam a próxima conversa.</p>
        <form id="login-form">
          <label for="password">Senha de acesso</label>
          <div class="login-fields"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="Digite a senha"><button type="submit">Acessar <span aria-hidden="true">→</span></button></div>
          <div class="login-feedback"><p class="error" id="login-error" role="alert" aria-live="polite"></p></div>
        </form>
      </div>
      <p class="login-foot">MULTIPLIX <span>×</span> IMOBILIÁRIA MARCIO RAPOSO</p>
    </section>
    <aside class="login-visual" aria-label="Multiplix — diagnóstico para Jaerty e Leo">
      <div class="login-ring" aria-hidden="true"></div>
      <div class="login-brand-art"><img src="/assets/multiplix-wordmark.jpg" alt="Multiplix" width="447" height="447"><div class="login-client-label"><span>RAIO-X COMERCIAL</span><strong>Marcio Raposo</strong></div></div>
      <p class="login-visual-note">DIAGNÓSTICO<br>JAERTY &amp; LEO</p>
    </aside>
  </main>
</body>
</html>
